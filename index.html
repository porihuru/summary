<!--
[JST 2026-01-25 11:05]  summary/index.html v20260125-01
入札 集計（admin/ope専用） ※bidder側は変更しない
要件:
  - admin/opeログイン必須（users/{uid}.role を参照）
  - 単価契約：合計は一切出さない
  - 最安判定：数値化できたものだけ比較（空欄/文字除外）、小数OK、同額最安は全ハイライト
  - 入札者表示：bidderId + profile.companyName
  - file://想定（Edge95配慮）
-->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>入札 集計（admin/ope専用）</title>

  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
      --danger:#b91c1c; --ok:#047857;
      --btn:#111827; --btnText:#fff; --btn2:#e5e7eb; --btn2Text:#111827;

      --minBg:#fff7ed; --minBd:#fb923c;
      --naBg:#f3f4f6;
    }
    body{ margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif; }
    .wrap{ max-width:1400px; margin:0 auto; padding:14px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title{ font-size:20px; font-weight:700; }
    .ver{ font-size:12px; color:var(--muted); }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .col{ flex:1; min-width:260px; }
    .btnRow{ display:flex; gap:8px; flex-wrap:wrap; }
    button{
      border:0; border-radius:10px; padding:10px 12px; font-size:14px;
      background:var(--btn); color:var(--btnText); cursor:pointer;
    }
    button.secondary{ background:var(--btn2); color:var(--btn2Text); }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    input{
      width:100%; box-sizing:border-box;
      border:1px solid var(--border); border-radius:10px;
      padding:10px 10px; font-size:14px; background:#fff;
    }
    label{ display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
    .hint{ font-size:12px; color:var(--muted); }
    .err{ border:1px solid #fecaca; background:#fff1f2; color:var(--danger); padding:10px; border-radius:10px; }
    .ok{ border:1px solid #a7f3d0; background:#ecfdf5; color:var(--ok); padding:10px; border-radius:10px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    .tableWrap{ overflow:auto; border:1px solid var(--border); border-radius:12px; }
    table{ width:max-content; min-width:100%; border-collapse:collapse; background:#fff; }
    th, td{ border-bottom:1px solid var(--border); padding:10px 8px; font-size:13px; vertical-align:top; }
    th{
      position:sticky; top:0; background:#fff; z-index:2;
      text-align:left; color:var(--muted); font-weight:600;
    }

    /* 左2列固定（横スクロールでも見える） */
    th.stickyL, td.stickyL{ position:sticky; left:0; background:#fff; z-index:3; }
    th.stickyL2, td.stickyL2{ position:sticky; left:70px; background:#fff; z-index:3; }

    td{ white-space:nowrap; }
    .td2line{ line-height:1.35; white-space:normal; min-width:240px; }
    .td2line .sub{ color:var(--muted); font-size:12px; margin-top:4px; display:block; }

    .cell-min{ background:var(--minBg); outline:2px solid var(--minBd); outline-offset:-2px; font-weight:700; }
    .cell-na{ background:var(--naBg); color:var(--muted); }
    .cell-empty{ color:var(--muted); }

    .footer{ margin-top:10px; font-size:12px; color:var(--muted); }
  </style>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">入札 集計（admin/ope専用）</div>
      <div class="ver mono" id="lblPageVer">v20260125-01</div>
    </div>

    <!-- 1) ログイン -->
    <div class="card">
      <div class="hint"><b>1) admin / ope ログイン（必須）</b></div>
      <div class="row">
        <div class="col">
          <label>メールアドレス</label>
          <input id="txtAdminEmail" type="email" autocomplete="username" />
        </div>
        <div class="col">
          <label>パスワード</label>
          <input id="txtAdminPass" type="password" autocomplete="current-password" />
        </div>
        <div class="col" style="min-width:220px;">
          <div class="btnRow" style="margin-top:20px;">
            <button id="btnAdminLogin" type="button">ログイン</button>
            <button id="btnAdminLogout" type="button" class="secondary">ログアウト</button>
          </div>
        </div>
      </div>

      <div class="hint" style="margin-top:8px;">
        状態: <span class="mono" id="lblLoginState">SIGNED-OUT</span> /
        role: <span class="mono" id="lblRole">-</span> /
        権限: <span class="mono" id="lblAuthz">NG</span>
      </div>
    </div>

    <!-- メッセージ -->
    <div class="card" id="msgBox" style="display:none;"></div>

    <!-- 2) 対象入札 -->
    <div class="card">
      <div class="hint"><b>2) 対象入札の集計</b>（単価契約：合計は出しません）</div>
      <div class="row">
        <div class="col">
          <label>入札番号（bidNo）</label>
          <input id="txtBidNo" type="text" inputmode="latin" placeholder="例: 2026002" />
          <div class="hint" style="margin-top:6px;">
            URLの <span class="mono">?bidNo=XXXX</span> があれば優先。無ければ入力値を使用。
          </div>
        </div>
        <div class="col" style="min-width:260px;">
          <div class="btnRow" style="margin-top:28px;">
            <button id="btnLoad" type="button" class="secondary">再読込</button>
            <button id="btnCsv" type="button" class="secondary">CSV出力</button>
            <button id="btnPrint" type="button" class="secondary">印刷</button>
          </div>
        </div>
      </div>

      <div class="hint" style="margin-top:8px;">
        最安判定は「数値化できた単価だけ」で行います（空欄/文字は比較対象外）。小数OK。同額最安はすべてハイライト。
      </div>
    </div>

    <!-- 3) 集計結果 -->
    <div class="card">
      <div class="hint"><b>3) 集計結果</b></div>
      <div class="tableWrap" style="margin-top:8px;">
        <table id="tblSummary">
          <thead id="theadSummary">
            <tr>
              <th class="stickyL" style="width:70px;">番号</th>
              <th class="stickyL2" style="min-width:260px;">品名／規格</th>
              <th style="min-width:120px;">予定数量</th>
              <th style="min-width:160px;">（入札者列は読込後に生成）</th>
            </tr>
          </thead>
          <tbody id="tbodySummary">
            <tr><td colspan="4" class="mono" style="color:#6b7280;">未読込</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="footer mono" id="lblFooter"></div>
  </div>

  <!-- summary側だけで完結（/shared/なし） -->
  <script src="js/00_summary_env.js"></script>
  <script src="js/20_summary_app.js"></script>
</body>
</html>
